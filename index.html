<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Markingspb AI</title>
  <meta name="description" content="Markingspb AI: edit videos by writing what you want." />
  <meta name="theme-color" content="#212121" />
  <link rel="icon" href="/logo.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="empty">
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand"><img src="/logo.svg" alt="" width="28" height="28" /><span>Markingspb AI</span></div>
      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-t="newChat"></span>
      </button>
      <nav class="chat-list" id="chatList"></nav>
      <div class="side-note">🔒 <span data-t="privacy"></span></div>
      <div class="lang"><button data-lang="ru" type="button">RU</button><button data-lang="en" type="button">EN</button></div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="mobile-bar">
        <button class="icon" id="menuBtn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="mobile-title">Markingspb AI</span>
        <button class="icon" id="newChat2" type="button" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="scroll" id="scroll">
        <div class="welcome" id="welcome">
          <img src="/logo.svg" alt="" width="56" height="56" />
          <h1 data-t="welcomeTitle"></h1>
          <p data-t="welcomeSub"></p>
        </div>
        <div class="thread" id="messages"></div>
      </div>

      <div class="bottom">
        <div class="chips" id="chips"></div>
        <form class="composer" id="form">
          <div class="attachments" id="attachments"></div>
          <textarea id="text" rows="1"></textarea>
          <div class="composer-bar">
            <div class="tools">
              <label class="tool"><input type="file" id="videoInput" accept="video/*" hidden />
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span data-t="addVideo"></span></label>
              <label class="tool"><input type="file" id="musicInput" accept="audio/*" hidden />
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm11-2a3 3 0 11-6 0 3 3 0 016 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                <span data-t="addMusic"></span></label>
            </div>
            <button type="submit" class="send" id="sendBtn" aria-label="Send">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </form>
        <div class="disclaimer" data-t="disclaimer"></div>
      </div>
    </main>
  </div>

  <div class="dropzone" id="dropzone" hidden><div>🎬 <span data-t="dropHere"></span></div></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
